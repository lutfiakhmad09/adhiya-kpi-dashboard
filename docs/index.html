<link rel="icon" href="logo.png">

  h1 { font-family: Georgia, serif; font-weight: 400; font-size: 1.6rem; margin: .3rem 0 0; }
  p { margin: 0; color: #6f5a5d; line-height: 1.5; font-size: .9rem; }
</style>
</head>
<body>
  <div class="card">
    <img src="logo.png" alt="Adhiya Travel">
